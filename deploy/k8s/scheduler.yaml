# The scheduler: a stateless Deployment. One replica; two are safe (the reaper
# is idempotent, migrations take an advisory lock), decision 2.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler
  namespace: kgpu
data:
  LISTEN_ADDR: ":8080"
  LOG_FORMAT: json
  POLICY: always_gpu
  REAP_INTERVAL: 2s
  MAX_ATTEMPTS: "5"
  WORKER_STALE_AFTER: 15s
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: kgpu
spec:
  selector:
    app: scheduler
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: kgpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: scheduler
          image: kgpu-scheduler:dev
          imagePullPolicy: IfNotPresent   # loaded into kind with `kind load docker-image`
          envFrom:
            - configMapRef:
                name: scheduler
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8080
          # Readiness: can reach Postgres (decision 6). Liveness: the process answers.
          # Leaves the Service's endpoints after failureThreshold x periodSeconds
          # of a failing database, about 9 s; observed 8 s (cross-check).
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: "100m", memory: "64Mi"}
            limits: {memory: "256Mi"}
